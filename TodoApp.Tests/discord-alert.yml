name: Discord Alerts

on:
  push:
    branches:
      - "**"

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL was not configured in repository secrets."
            exit 1
          fi

          python3 - <<'PY' > discord_payload.json
          import json
          import os

          sha = os.environ["COMMIT_SHA"][:7]
          content = (
              "**GitHub Actions - Novo commit**\n"
              f"Repositorio: `{os.environ['REPOSITORY']}`\n"
              f"Autor: `{os.environ['ACTOR']}`\n"
              f"Branch: `{os.environ['BRANCH']}`\n"
              f"Commit: `{sha}`\n"
              f"Mensagem: {os.environ['COMMIT_MESSAGE']}\n"
              f"Link: {os.environ['COMMIT_URL']}"
          )

          print(json.dumps({"content": content}, ensure_ascii=False))
          PY

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK_URL"
